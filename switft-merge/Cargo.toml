[package]
name = "switft-merge"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.9.2"
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.0", features = ["full"] }
prost-types = "0.13"
log = "0.4.29"
simplelog = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
page_size = "0.6.0"
uuid = { version = "1.20.0", features = [
    "v4",
    "v7",
    "serde",
] } # Check crates.io for the latest version


[build-dependencies]
tonic-build = "0.12"
